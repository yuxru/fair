[project]
name = "fair"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuxru", email = "yuxiaje@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pyplotlib>=0.0.56",
]

[project.scripts]
fair = "fair:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
